[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ksp"
version = "0.1.0"
description = "Kinase-substrate site predictor (R2 LightGBM + R3 neural late fusion) with a leakage-controlled evaluation harness; MVP release accompanying the manuscript"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT (code only; see LICENSE and NOTICE; released predictions: CC BY-NC-SA 3.0)" }
authors = [{ name = "[authors to be added by the publishing researcher]" }]
# Core: enough for the evaluation harness, the R2 model, the baselines without GPU, and the unit tests.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "requests",
    "tqdm",
    "openpyxl",
]

[project.optional-dependencies]
# GPU parts: ESM-2 embeddings, R3, Phosformer (B3) retraining. Install torch for your CUDA version first.
gpu = ["torch>=2.4", "transformers>=4.45"]
# Remaining feature builders and baselines (B4 SELPHI2.0 uses xgboost; downstream reads benchmarKIN .rda files).
full = ["xgboost>=2.0", "biopython", "statsmodels", "networkx", "xlrd", "rdata==1.1.0", "matplotlib", "seaborn", "pypdf"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["requires_data(*paths): needs project data files (paths relative to KSP_DATA_DIR); skipped when absent"]
